name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy pytest

      - name: Run unit tests
        run: pytest tests/ -v

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: anachart-api:latest

      - name: Build chatbot image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.chatbot
          push: false
          tags: anachart-chatbot:latest

      # To actually deploy (push to a registry + trigger a rollout), add
      # steps here using your registry's credentials, e.g.:
      #   - uses: docker/login-action@v3
      #     with:
      #       registry: your-registry.example.com
      #       username: ${{ secrets.REGISTRY_USER }}
      #       password: ${{ secrets.REGISTRY_PASSWORD }}
      # then change push: false to push: true above, and add tags
      # pointing at your registry (e.g. your-registry.example.com/anachart-api:latest).
      # This is left as a placeholder since it depends on where you
      # actually host the deployed containers (AWS/GCP/Azure/etc.).
